name: Update Homebrew tap
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger the tap updater immediately
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set HOMEBREW_TAP_TOKEN to a fine-grained token with Actions write access to karimz1/homebrew-tap. You can also run Update oflh manually in that repository.'
            exit 1
          fi
          gh workflow run update-oflh.yml --repo karimz1/homebrew-tap --ref main
