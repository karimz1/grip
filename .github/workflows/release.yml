name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0); select this tag as the workflow ref
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require the selected tag to match this workflow revision
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py validate --version "$TAG"
          test "$TAG" != dev
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
  test:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
  homebrew:
    needs: test
    name: Homebrew / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oflh-*
          merge-multiple: true
          path: dist
      - name: Prepare the real release formula with local executable URLs
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py assemble --version "$TAG" --formula "$RUNNER_TEMP/oflh.rb"
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          import os
          p=Path(os.environ['RUNNER_TEMP']) / 'oflh.rb'
          s=p.read_text()
          s=re.sub(r'https://github.com/karimz1/open-file-lock-handle/releases/download/[^/]+/',Path('dist').resolve().as_uri()+'/',s)
          p.write_text(s)
          PYCODE
      - name: Install and test the generated formula
        shell: bash
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap-new karimz1/open-file-lock-handle-ci --no-git
          cp "$RUNNER_TEMP/oflh.rb" "$(brew --repository karimz1/open-file-lock-handle-ci)/Formula/oflh.rb"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --formula karimz1/open-file-lock-handle-ci/oflh
          HOMEBREW_NO_AUTO_UPDATE=1 brew test karimz1/open-file-lock-handle-ci/oflh
  draft:
    needs: [test, homebrew]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oflh-*
          merge-multiple: true
          path: dist
      - name: Verify all six targets and generate checksums and Homebrew formula
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py assemble --version "$TAG" --formula "$RUNNER_TEMP/oflh.rb"
          cd dist
          sha256sum --check checksums.txt
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft >/tmp/release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/release.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          echo '### Release ready for review' >> "$GITHUB_STEP_SUMMARY"
          echo 'All platform jobs passed. The release remains a draft until you publish it.' >> "$GITHUB_STEP_SUMMARY"
