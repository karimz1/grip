<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="title description">
  <title id="title">oflh — Open File Lock Handle</title>
  <desc id="description">A violet terminal prompt and open padlock beside the oflh wordmark. Built with Rust.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="198" rx="24" fill="#171721" stroke="#353345" stroke-width="2"/>
  <rect x="28" y="28" width="144" height="144" rx="26" fill="#252235"/>
  <path d="M51 80 L69 96 L51 112 M79 114 H97" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M115 93 V77 a18 18 0 0 1 36 0" fill="none" stroke="#C4B5FD" stroke-width="7" stroke-linecap="round"/>
  <rect x="105" y="94" width="51" height="45" rx="10" fill="url(#accent)"/>
  <circle cx="130.5" cy="112" r="4" fill="#252235"/>
