  <text x="209" y="128" fill="#C4B5FD" font-family="system-ui, 'DejaVu Sans', sans-serif" font-size="21">Open File Lock Handle</text>
  <text x="209" y="157" fill="#A7A3BA" font-family="system-ui, 'DejaVu Sans', sans-serif" font-size="16">Find the process. Understand the lock.</text>
  <rect x="582" y="48" width="144" height="34" rx="17" fill="#352820" stroke="#C78963"/>
  <text x="654" y="70" text-anchor="middle" fill="#F4BC91" font-family="system-ui, 'DejaVu Sans', sans-serif" font-weight="600" font-size="13" letter-spacing="1">BUILT WITH RUST</text>
</svg>
